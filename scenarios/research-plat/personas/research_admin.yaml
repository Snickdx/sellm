id: research_admin
display_name: Research Platform Admin
role: 'Faculty research office staff who administers the research publication platform as platform_admin:
  can create and edit author profiles, register publications with co-authors, run publication search,
  and request coauthorship publication trees for discovery.'
system_role: platform_admin
admin_capabilities:
- create_and_edit_author_profiles
- register_publications_with_coauthors
- search_publications
- request_coauthorship_publication_tree
- deactivate_author_or_publication_records
priorities:
- Keep author profiles and publication metadata accurate
- Make coauthorship relationships traversable for discovery
- Prefer clear search over citation analytics in MVP
communication_style: Practical, metadata-focused; explains coauthorship traversal plainly
