  why_it_matters: Prevents cloning the entire production suite as student MVP scope.
  alternatives:
  - MVP core — admin approves alumni registration; alumni browse job + events boards; admin can post/broadcast
    announcements (directory/mentorship/groups/email-builder out or elicitation)
  - Broad clone — jobs, events, directory, messaging, groups, mentorship, email campaigns all required
  - Admin registration approval + announcement email only (no boards)
  - Defer for student elicitation
  recommended_default: MVP core — admin approves alumni registration; alumni browse job + events boards;
    admin can post/broadcast announcements
  status: decided
  actions:
  - accept
  - modify
  - reject
  - defer
- id: GAP-UC-003
  priority: critical
  prompt: 'Registration is staff-managed: applicants register, staff verify alumni

    status, then approve. How strict is that for the graded MVP?

    '
  citations:
  - file: sources/UWI Connect Project Interview - Adrian Chatoor.vtt
    cue_id: 60db8bca-1069-48c1-83b3-545cbbf86006/15-2
    start: '00:01:22.803'
    end: '00:01:27.286'
    speaker: null
  - file: sources/UWI Connect Project Interview - Adrian Chatoor.vtt
    cue_id: 60db8bca-1069-48c1-83b3-545cbbf86006/15-3
    start: '00:01:27.286'
    end: '00:01:31.271'
    speaker: null
  - file: sources/UWI Connect Project Interview - Adrian Chatoor.vtt
    cue_id: 60db8bca-1069-48c1-83b3-545cbbf86006/15-4
    start: '00:01:31.271'
    end: '00:01:35.114'
    speaker: null
  why_it_matters: Auth/access control for a closed alumni community.
  alternatives:
  - Hard gate — pending until alumni_admin approves; unapproved users cannot access boards
  - Soft gate — auto-activate; admin can revoke later
  - Open registration with no admin review
  - Defer for student elicitation
  recommended_default: Hard gate — pending until alumni_admin approves; unapproved users cannot access
    boards
  status: decided
  actions:
  - accept
  - modify
  - reject
  - defer
- id: GAP-UC-004
  priority: critical
  prompt: 'Who may post job (and event) listings on the graded boards?

    '
  citations:
  - file: sources/UWI Connect Project Interview - Adrian Chatoor.vtt
    cue_id: 60db8bca-1069-48c1-83b3-545cbbf86006/17-0
    start: '00:01:43.034'
