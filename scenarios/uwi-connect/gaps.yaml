- id: GAP-UC-001
  priority: critical
  prompt: 'Stakeholder is Miss Sophia Francis (fundraising and alumni department) for

    UE/UWI Connect — an alumni reconnect platform with managed registration,

    job board, events, directory, email, mentorship, messaging, and groups.

    Which personas should the student-facing scenario include?

    '
  citations:
  - file: sources/UWI Connect Project Interview - Adrian Chatoor.vtt
    cue_id: 60db8bca-1069-48c1-83b3-545cbbf86006/8-1
    start: '00:00:08.137'
    end: '00:00:11.835'
    speaker: null
  - file: sources/UWI Connect Project Interview - Adrian Chatoor.vtt
    cue_id: 60db8bca-1069-48c1-83b3-545cbbf86006/14-2
    start: '00:01:06.850'
    end: '00:01:11.754'
    speaker: null
  - file: sources/UWI Connect Project Interview - Adrian Chatoor.vtt
    cue_id: 60db8bca-1069-48c1-83b3-545cbbf86006/15-4
    start: '00:01:31.271'
    end: '00:01:35.114'
    speaker: null
  - file: sources/UWI Connect Project Interview - Adrian Chatoor.vtt
    cue_id: 60db8bca-1069-48c1-83b3-545cbbf86006/27-3
    start: '00:04:24.173'
    end: '00:04:28.791'
    speaker: null
  why_it_matters: Personas bound known_fact_ids.
  alternatives:
  - alumni_admin only (transcript-faithful)
  - alumni_admin + alumnus
  - alumni_admin + alumnus + current_student
  - Defer — decide after pilot
  recommended_default: alumni_admin + alumnus
  status: decided
  actions:
  - accept
  - modify
  - reject
  - defer
- id: GAP-UC-002
  priority: critical
  prompt: 'With alumni_admin-only chat (DEC-UC-001), what is the graded product

    boundary? The live platform is feature-heavy; stakeholder also wants

    simplicity and notes email is the primary engagement channel today.

    '
