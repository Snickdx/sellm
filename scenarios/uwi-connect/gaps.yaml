    note: Possible company recruiting partnerships
  why_it_matters: Content moderation and alumni trust for opportunities.
  alternatives:
  - alumni_admin posts all jobs/events (alumni read-only on boards)
  - Alumni may submit jobs/events pending admin publish
  - Alumni publish jobs/events directly; admin can take down
  - Defer for student elicitation
  recommended_default: alumni_admin posts all jobs/events (alumni read-only on boards)
  status: decided
  actions:
  - accept
  - modify
  - reject
  - defer
- id: GAP-UC-005
  priority: critical
  prompt: 'DEC-UC-002 includes alumni_admin announcements/broadcasts. How should

    those reach alumni in the graded MVP?

    '
  citations:
  - file: sources/UWI Connect Project Interview - Adrian Chatoor.vtt
    cue_id: 60db8bca-1069-48c1-83b3-545cbbf86006/18-3
    start: '00:02:16.940'
    end: '00:02:20.000'
    speaker: null
