facts:
- id: UC-ASM-001
  statement: The only student-facing chatbot persona is alumni_admin (fundraising / alumni staff voice).
    There is no alumnus chatbot persona.
  category: assumption
  status: assumed
  origin: instructor
  decision_id: DEC-UC-001
  approved_by: instructor
  approved_at: '2026-11-03T14:16:00Z'
  rationale: Instructor chose alumni_admin only.
  known_by:
  - alumni_admin
  disclosure: never_student
- id: UC-ASM-002
  statement: 'Graded MVP product boundary: UWI-email-verified alumni browse job and events boards; alumni
    may submit listings for admin publish; alumni_admin publishes boards content and builds/sends email
    campaigns. Directory, mentorship, messaging, and groups are out of graded MVP.'
  category: assumption
  status: assumed
  origin: instructor
  decision_id: DEC-UC-002
  approved_by: instructor
  approved_at: '2026-11-03T14:18:00Z'
  rationale: Instructor accepted MVP core; registration mechanism later set by DEC-UC-003; posting by
    DEC-UC-004; campaigns by DEC-UC-005.
  known_by:
  - alumni_admin
  disclosure: when_relevant
- id: UC-ASM-003
  statement: Primary access gate for graded MVP is verification of a UWI email address, not manual staff
    alumni-status approval after lookup.
  category: assumption
  status: assumed
  origin: instructor
  decision_id: DEC-UC-003
  approved_by: instructor
  approved_at: '2026-11-03T14:19:00Z'
  rationale: Instructor modified recommended hard admin-approve gate. Tension with UC-REQ-006 (alumni
    often leave student email) is intentional elicitation material.
  known_by:
  - alumni_admin
  disclosure: when_relevant
- id: UC-ASM-004
  statement: Alumni may submit job and event listings that remain pending until alumni_admin publishes
    them.
  category: assumption
  status: assumed
  origin: instructor
  decision_id: DEC-UC-004
  approved_by: instructor
  approved_at: '2026-11-03T14:20:00Z'
  rationale: Instructor accepted option 2.
  known_by:
  - alumni_admin
  disclosure: when_relevant
- id: UC-ASM-005
  statement: Graded MVP requires a full email campaign builder (compose, audience, send) for alumni_admin
    — not in-app announcements alone.
  category: assumption
  status: assumed
  origin: instructor
  decision_id: DEC-UC-005
  approved_by: instructor
  approved_at: '2026-11-03T14:22:00Z'
  rationale: Instructor accepted option 3 over recommended in-app-only default.
  known_by:
  - alumni_admin
  disclosure: when_relevant
- id: UC-ASM-006
  statement: 'alumni_admin is platform_admin: may publish, reject, and unpublish job/event listings; compose
    and send email campaigns; and revoke or disable alumni accounts. Exact UI labels and notification
    copy stay student elicitation.'
  category: assumption
  status: assumed
  origin: instructor
  decision_id: DEC-UC-006
  approved_by: instructor
  approved_at: '2026-11-10T03:13:00Z'
  rationale: Instructor chose platform_admin (option 1).
  known_by:
  - alumni_admin
  disclosure: when_relevant
- id: UC-ASM-007
  statement: alumni_admin may reject pending submissions and unpublish live listings at any time; the
    listing leaves the public board immediately; the submitter receives an in-system notification. Notification
    wording and optional reject reason stay student elicitation.
  category: assumption
  status: assumed
  origin: instructor
  decision_id: DEC-UC-007
  approved_by: instructor
  approved_at: '2026-11-10T03:13:30Z'
  rationale: Instructor chose reject/unpublish with in-system notify (option 1).
  known_by:
  - alumni_admin
  disclosure: when_relevant
- id: UC-ASM-008
  statement: alumni_admin may revoke or disable a verified alumni account at any time; revoked accounts
    cannot browse boards and are excluded from campaign audiences until re-enabled. Re-enable rules and
    reason fields stay student elicitation.
  category: assumption
  status: assumed
  origin: instructor
  decision_id: DEC-UC-008
  approved_by: instructor
  approved_at: '2026-11-10T03:14:00Z'
  rationale: Instructor chose admin revoke anytime (option 1).
  known_by:
  - alumni_admin
  disclosure: when_relevant
- id: UC-ASM-009
  statement: Campaign audiences are all currently verified, non-revoked alumni. No further attribute segments
    or CSV list upload are required for graded MVP.
  category: assumption
  status: assumed
  origin: instructor
  decision_id: DEC-UC-009
  approved_by: instructor
  approved_at: '2026-11-10T03:14:30Z'
  rationale: Instructor chose all verified non-revoked only (option 1), not optional attribute filters.
  known_by:
  - alumni_admin
  disclosure: when_relevant
- id: UC-ASM-010
  statement: Only alumni_admin can browse the full pending job/event queue. Each submitter can see the
    status of their own submissions. Other alumni cannot see a listing until it is published. Exact status
    labels stay student elicitation.
  category: assumption
  status: assumed
  origin: instructor
  decision_id: DEC-UC-010
  approved_by: instructor
  approved_at: '2026-11-10T03:16:00Z'
  rationale: Instructor chose admin queue + own-status visibility (option 1).
  known_by:
  - alumni_admin
  disclosure: when_relevant
