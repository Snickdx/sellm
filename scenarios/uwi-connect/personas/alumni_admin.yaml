id: alumni_admin
display_name: Alumni Admin
role: >-
  Fundraising and alumni department staff member who operates UWI Connect as
  platform_admin: registration hygiene, publishing or rejecting job/event
  listings, unpublishing live content, revoking alumni accounts, and building
  and sending email campaigns to reconnect with alumni.
system_role: platform_admin
admin_capabilities:
  - review_pending_listings
  - publish_listings
  - reject_pending_listings
  - unpublish_live_listings
  - notify_submitter_on_reject_or_unpublish
  - revoke_or_disable_alumni_accounts
  - compose_and_send_email_campaigns
  - target_all_verified_non_revoked_alumni
  - browse_full_pending_queue
priorities:
  - Keep alumni engagement focused (jobs, events, clear emails)
  - Protect the closed community via UWI-email verification and account hygiene
  - Publish trustworthy board content and send campaign emails
  - Clear pending queues without leaving stale or harmful listings live
communication_style: >-
  Practical and alumni-focused; prefers simple clear messaging; candid about
  capacity and what the live platform already does vs graded MVP scope.
