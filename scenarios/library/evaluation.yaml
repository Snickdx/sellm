    competency: requirements_coverage
    description: Student SRS should mention course code, headcount, date, and resources.
    related_fact_ids: [LIB-REQ-002]
  - id: EVAL-LIB-002
    competency: conflict_policy
    description: Student should discover earlier-request-wins with coordinator override.
    related_fact_ids: [LIB-REQ-003]
