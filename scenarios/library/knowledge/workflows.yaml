  statement: 'Booking request flow: lecturer submits course code, headcount, preferred date, and resources;
    request enters library_coordinator review; on approve, a shareable confirmation is issued; on conflict,
    earlier request wins unless coordinator overrides for a larger cohort; over-capacity requests are
    hard-rejected before or during review.'
