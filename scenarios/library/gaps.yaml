open_questions:
  - id: GAP-LIB-001
    priority: important
    prompt: How late may a lecturer cancel a confirmed workshop booking?
    citations:
      - file: sources/library-synthetic.vtt
        cue_id: cue-0007
        start: "00:00:52.500"
        end: "00:01:01.000"
        speaker: coordinator
        note: Coordinator states cancellation deadline is fuzzy
    why_it_matters: Affects fairness, room reuse, and student notifications.
    alternatives:
      - Up to 24 hours before start
      - Up to 2 hours before start
      - Any time before start
      - Defer for student elicitation
    recommended_default: Up to 24 hours before start
    suggested_assumption: |
      Lecturers may cancel their own confirmed workshop booking any time before
      start; the library coordinator may also cancel for operational reasons.
      Notification copy remains elicitation.
    status: decided
    actions: [accept, modify, reject, defer]

  - id: GAP-LIB-002
    priority: critical
    theme: system_authority
    prompt: |
      Depth-update: library_coordinator currently has a thin role string and
      refers capacity disputes to administrator. For the graded booking system,
      is the coordinator the primary platform operator (approves/manages bookings,
      rooms, overrides), with administrator as capacity-policy escalations only?
    citations:
      - file: sources/library-synthetic.vtt
        cue_id: cue-0002
        note: Coordinator receives requests by email and checks room calendar
      - file: sources/library-synthetic.vtt
        cue_id: cue-0005
        note: Coordinator may override conflicts for larger cohorts
      - file: sources/library-synthetic.vtt
        cue_id: cue-0008
        note: Administrator speaks to capacity must not be exceeded
    why_it_matters: >-
      Sets system_role / admin_capabilities and whether students elicit coordinator
      ops vs a separate admin surface.
    alternatives:
      - library_coordinator = platform_admin for booking ops; administrator = capacity policy / escalation only
      - administrator = platform_admin; coordinator = day-to-day operator without overrides
      - Both are full platform_admins with overlapping powers
      - Defer for student elicitation
    recommended_default: >-
      library_coordinator = platform_admin for booking ops; administrator = capacity policy / escalation only
    suggested_assumption: |
      library_coordinator is platform_admin for workshop booking operations
      (review requests, prevent double-booking, apply conflict preference,
      override for larger cohorts, confirmations). administrator is approver/
      escalation for capacity-policy disputes and room capacity configuration,
      not day-to-day booking queue work.
    status: decided
    actions: [accept, modify, reject, defer]

  - id: GAP-LIB-003
    priority: important
    theme: approval_power
    prompt: |
      When a lecturer submits a workshop booking request, does it become
      confirmed automatically if the slot is free and under capacity, or must
      the library_coordinator explicitly approve/confirm?
    citations:
      - file: sources/library-synthetic.vtt
        cue_id: cue-0002
        note: Coordinator currently receives requests by email
      - file: sources/library-synthetic.vtt
        cue_id: cue-0006
        note: Lecturers need confirmation after booking is accepted
    why_it_matters: Defines submit→confirm workflow and coordinator queue depth.
    alternatives:
      - Auto-confirm when slot free and under capacity; coordinator only handles conflicts/overrides
      - Always require library_coordinator explicit approve/confirm before confirmation is issued
      - Auto-confirm under capacity; administrator must approve any override cases
      - Defer for student elicitation
    recommended_default: >-
      Always require library_coordinator explicit approve/confirm before
      confirmation is issued
    suggested_assumption: |
      Every booking request enters a coordinator review queue. A shareable
      confirmation is issued only after library_coordinator explicitly
      approves/confirms (auto-confirm is out of graded MVP unless elicited).
    status: decided
    actions: [accept, modify, reject, defer]

  - id: GAP-LIB-004
    priority: important
    theme: exception_path
    prompt: |
      If a request would exceed room capacity, what should the system do?
    citations:
      - file: sources/library-synthetic.vtt
        cue_id: cue-0008
        note: Rooms must not be overbooked beyond capacity
    why_it_matters: Capacity hard rule vs waitlist/reject UX for students to elicit detail.
    alternatives:
      - Hard reject — cannot book over capacity; lecturer must reduce headcount or pick another slot
      - Waitlist — request stays pending until capacity frees or coordinator resolves
      - Allow overbook only with administrator override (coordinator alone cannot)
      - Defer for student elicitation
    recommended_default: >-
      Hard reject — cannot book over capacity; lecturer must reduce headcount or
      pick another slot
    suggested_assumption: |
      Requests that would exceed configured room capacity are rejected (never
      silently overbooked). Waitlisting and administrator overbook overrides are
      out of graded MVP unless elicited.
    status: decided
    actions: [accept, modify, reject, defer]

  - id: GAP-LIB-005
    priority: important
    theme: config_default
    prompt: |
      Who may create/update workshop rooms and their capacity values (default 30
      unless overridden per LIB-ASM-001)?
    citations:
      - file: sources/library-synthetic.vtt
        cue_id: cue-0008
        note: Administrator enforces capacity limits
    why_it_matters: Separates booking ops (coordinator) from capacity configuration (admin).
    alternatives:
      - administrator only configures rooms/capacities; coordinator uses them in booking
      - library_coordinator can also edit room capacities
      - Rooms/capacities are fixed fixtures for MVP (no in-app config); students elicit
      - Defer for student elicitation
    recommended_default: >-
      administrator only configures rooms/capacities; coordinator uses them in
      booking
    suggested_assumption: |
      administrator configures workshop rooms and per-room capacities (default 30
      when unset). library_coordinator consumes those values for booking checks
      and does not change capacity configuration in graded MVP unless elicited.
    status: decided
    actions: [accept, modify, reject, defer]

