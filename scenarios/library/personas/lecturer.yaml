id: lecturer
display_name: Course Lecturer
role: Course lecturer who requests library workshops for classes, needs a shareable confirmation after
  coordinator approval, and may cancel a confirmed booking any time before start if the class timetable
  changes.
system_role: end_user
admin_capabilities: []
priorities:
- Book a suitable slot for the class
- Receive a confirmation to share with students
- Cancel if the class timetable changes
communication_style: Student-focused; less aware of room conflict rules
