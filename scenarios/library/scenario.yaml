brief: Lecturers request workshop sessions on library resources from a booking system operated by the
  library coordinator (explicit approve/confirm; conflict preference with larger-cohort override; cancellations
  any time before start). Over-capacity requests are hard-rejected. Administrator and coordinator may
  configure rooms/capacities (default 30); administrator escalates capacity-policy disputes. Lecturers
  need shareable confirmations after acceptance.
