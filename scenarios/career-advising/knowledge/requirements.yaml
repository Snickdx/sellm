  - id: CA-REQ-002
    statement: >-
      Learners explore from two angles: (A) choose a desired career/end-state and
      work out how to get there, and (B) start from subjects/courses they have or
      like and discover matching careers.
    category: functional
    status: confirmed
    origin: transcript
    source_refs:
      - file: sources/Career Based Advising Project Interview - Preity Ramlochan.vtt
        cue_id: ce79ae11-2948-4867-9874-6d025f3228ff/40-1
        start: "00:05:09.437"
        end: "00:05:13.432"
        speaker: null
      - file: sources/Career Based Advising Project Interview - Preity Ramlochan.vtt
        cue_id: ce79ae11-2948-4867-9874-6d025f3228ff/43-0
        start: "00:05:54.141"
        end: "00:05:58.430"
        speaker: null
      - file: sources/Career Based Advising Project Interview - Preity Ramlochan.vtt
        cue_id: ce79ae11-2948-4867-9874-6d025f3228ff/43-2
        start: "00:06:03.177"
        end: "00:06:05.751"
        speaker: null
        note: Explicitly framed as two angles
    known_by: [career_advisor]
    disclosure: when_relevant
    acceptance_criteria:
      - A user can start from a target career and see related course/path guidance.
      - A user can start from a course/subject set and see suited careers.

  - id: CA-REQ-003
    statement: >-
      Career information should include credible details such as salaries and
      longer-term achievements or progression associated with careers.
    category: functional
