facts:
  - id: CA-REQ-001
    statement: >-
      Many learners lack clear career direction and need guidance connecting
      education choices to jobs and expectations; the advising tool exists to
      reduce that uncertainty.
    category: functional
    status: confirmed
    origin: transcript
    source_refs:
