    decision_id: DEC-TT-002
    approved_by: instructor
    approved_at: "2026-11-03T14:08:00Z"
    rationale: Instructor required full multi-role app.
    known_by: [pg_coordinator, supervisor]
    disclosure: when_relevant
    acceptance_criteria:
      - A student role can submit work linked to their thesis record.
      - A supervisor can attach feedback notes to a submission with a due date.
      - A coordinator can view pairings, notes, and overdue feedback.
