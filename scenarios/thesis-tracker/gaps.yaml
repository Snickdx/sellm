        speaker: null
      - file: sources/Thesis Tracker Project - Brent Eversley.vtt
        cue_id: eecbf71e-1536-4b52-8706-c48e23458026/78-3
        start: "00:07:56.677"
        end: "00:08:00.230"
        speaker: null
      - file: sources/Thesis Tracker Project - Brent Eversley.vtt
        cue_id: eecbf71e-1536-4b52-8706-c48e23458026/325-3
        start: "00:34:40.762"
        end: "00:34:45.382"
        speaker: null
        note: Progress summary for grad studies
      - file: sources/Thesis Tracker Project - Brent Eversley.vtt
        cue_id: eecbf71e-1536-4b52-8706-c48e23458026/230-1
        start: "00:24:23.817"
        end: "00:24:28.578"
        speaker: null
        note: Supervisor capacity mentioned
    why_it_matters: Structures progress tracking without over-prescribing every department ritual.
    alternatives:
      - Configurable milestone checklist per programme + coordinator progress export/summary
      - Fixed universal milestone set hard-coded for all programmes
      - Freeform progress notes only — no structured milestones
      - Defer for student elicitation
    recommended_default: >-
      Configurable milestone checklist per programme + coordinator progress
      export/summary
    status: decided
    actions: [accept, modify, reject, defer]

