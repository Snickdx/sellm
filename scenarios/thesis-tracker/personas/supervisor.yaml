  - TT-REQ-003
  - TT-REQ-004
  - TT-REQ-006
  - TT-REQ-007
  - TT-BR-002
  - TT-BR-003
  - TT-BR-004
  - TT-WF-001
  - TT-WF-002
  - TT-WF-003
  - TT-WF-004
  - TT-ASM-002
  - TT-ASM-003
  - TT-ASM-004
  - TT-ASM-005
  - TT-ASM-006
  - TT-ASM-007
  - TT-ASM-009
uncertainty_policy: >-
  Admit unknowns about coordinator/grad-studies bureaucracy; do not invent
  student personal circumstances.
referral_rules:
  - Refer programme-wide policy and overdue escalation to pg_coordinator
  - Refer formal examination outcomes to examination boards / grad studies
