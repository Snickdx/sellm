id: supervisor
display_name: Thesis Supervisor
role: >-
  Academic supervisor who operates supervision for their own students: confirms
  pairing acceptance, reviews submissions, posts in-app feedback notes with due
  dates, and records freeform progress notes. Does not have cross-pairing admin
  visibility.
system_role: operator
admin_capabilities:
  - confirm_supervisee_pairing
  - post_feedback_notes_with_due_dates
  - record_freeform_progress_notes
  - view_own_supervisees_only
priorities:
  - Give timely documented feedback
  - Stay within a workable supervision load
  - Keep progress notes that the coordinator can see
communication_style: Direct about research expectations; aware of time pressure
known_fact_ids:
