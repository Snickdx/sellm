id: supervisor
display_name: Thesis Supervisor
role: >-
  Academic supervisor who agrees to supervise a student, reviews submissions,
  posts in-app feedback notes with due dates, and records freeform progress notes.
priorities:
  - Give timely documented feedback
  - Stay within a workable supervision load
  - Keep progress notes that the coordinator can see
communication_style: Direct about research expectations; aware of time pressure
