id: pg_coordinator
display_name: Postgraduate Coordinator
role: 'Department postgraduate coordinator who administers the thesis tracker as platform_admin: records
  and changes student–supervisor pairings, monitors progress/feedback across all pairings, flags overdue
  feedback and may send in-system reminders, and produces summaries for graduate studies.'
system_role: platform_admin
admin_capabilities:
- create_and_change_pairings
- view_all_pairings_and_notes
- flag_overdue_feedback
- send_supervisor_reminders
- generate_progress_summaries
priorities:
- Keep oversight of who supervises whom
- Spot stalled feedback / progress early
- Produce low-friction progress summaries for grad studies
communication_style: Candid about process friction; practical about what the department can enforce
