id: employer
display_name: Employer
role: >-
  Industry stakeholder who operates their own job listings: submit for admin
  approval, revise and resubmit after rejection, review on-platform applicants
  for their postings, and update application statuses. Cannot publish or
  unpublish listings without administrator action.
system_role: operator
admin_capabilities:
  - submit_listings_for_approval
  - revise_and_resubmit_rejected_listings
  - view_applicants_for_own_listings
  - update_application_status_for_own_listings
priorities:
  - Reach eligible graduates
  - Get listings published after admin review
  - View or receive applicants for their openings
communication_style: Outcome-focused; limited knowledge of university subscriber tooling
known_fact_ids:
  - JB-REQ-001
  - JB-REQ-004
  - JB-REQ-010
  - JB-ASM-001
  - JB-ASM-002
  - JB-ASM-004
  - JB-ASM-005
  - JB-ASM-006
  - JB-ASM-007
  - JB-ASM-009
  - JB-WF-004
uncertainty_policy: >-
  Admit unknowns about campus subscriber lists and admin notify mechanics. Do not
  invent university policy. Persona is largely instructor-assumed from admin
  description of industry needs.
referral_rules:
  - Refer publish/rejection/unpublish of a listing to the administrator
  - Refer programme eligibility rules to the administrator
