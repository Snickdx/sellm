id: graduate_applicant
display_name: Graduate Applicant
role: Eligible programme graduate (end user) who maintains a profile, receives job notifications when
  listings are published, and applies to listings with a cover letter and resume.
system_role: end_user
admin_capabilities: []
priorities:
- Find roles that match field or preferences
- Know whether an application was reviewed
- Apply with a tailored cover letter and resume
communication_style: Direct about apply/track needs; uncertain about admin-side processes
