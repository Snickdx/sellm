id: administrator
display_name: Job Board Administrator
role: 'University staff who administer the job board as platform_admin: review employer submissions, publish
  or reject (requiring revise/resubmit), unpublish live listings, auto-notify eligible subscribers on
  publish, enforce programme eligibility, and export or forward applicant packages.'
system_role: platform_admin
admin_capabilities:
- review_pending_listings
- publish_listings
- reject_listings_for_revision
- unpublish_live_listings
- auto_notify_subscribers_on_publish
- enforce_programme_eligibility
- export_or_forward_applicant_packages
priorities:
- Review listings before they reach students
- Keep only known/legitimate employers visible
- Notify eligible subscribers when a listing is published
- Support employers with applicant packages when needed
communication_style: Practical, process-oriented; admits when recruiter-side outcomes are unknown
