facts:
- id: JB-ASM-001
  statement: 'On-platform applications use statuses: submitted, reviewed, shortlisted, rejected, hired.
    Applicants can see the current status of their applications.'
  category: assumption
  status: assumed
  origin: instructor
  decision_id: DEC-JB-002
  approved_by: instructor
  approved_at: '2026-11-02T20:23:00Z'
  rationale: Transcript confirms missing feedback loop as a pain point but does not define target statuses;
    instructor chose a full pipeline.
  known_by:
  - administrator
  - graduate_applicant
  - employer
  disclosure: when_relevant
  acceptance_criteria:
  - An applicant can view status among the five defined values for each application.
  - Status transitions are recorded and visible to the applicant.
- id: JB-ASM-002
  statement: Employers submit job listings that enter a pending state; an administrator must approve before
    the listing is published to students.
  category: assumption
  status: assumed
  origin: instructor
  decision_id: DEC-JB-003
  approved_by: instructor
  approved_at: '2026-11-02T20:23:30Z'
  rationale: Transcript describes admin review-then-publish after form intake; instructor chose employer
    self-serve submit with admin approval for the student project.
  known_by:
  - administrator
  - employer
  disclosure: when_relevant
  acceptance_criteria:
  - Pending listings are not visible to graduate applicants.
  - Only an admin approval/publish action makes a listing visible.
- id: JB-ASM-003
  statement: Only eligible programme students (currently DCIT) may subscribe and apply; ineligible accounts
    cannot complete those actions.
  category: assumption
  status: assumed
  origin: instructor
  decision_id: DEC-JB-004
  approved_by: instructor
  approved_at: '2026-11-02T20:23:45Z'
  rationale: Transcript states the platform is released specifically for DCIT students; instructor confirmed
    this as a hard eligibility constraint.
  known_by:
  - administrator
  - graduate_applicant
  disclosure: when_relevant
  acceptance_criteria:
  - Subscribe and apply are rejected for users outside the eligible programme.
- id: JB-ASM-004
  statement: For on-platform collected applications, employers can view applicants for their own listings
    in-app, and administrators can also export or forward an applicant package.
  category: assumption
  status: assumed
  origin: instructor
  decision_id: DEC-JB-005
  approved_by: instructor
  approved_at: '2026-11-02T20:24:00Z'
  rationale: Transcript mentions forwarding short lists / sending applicants to employers without specifying
    in-app employer access; instructor chose both.
  known_by:
  - administrator
  - employer
  disclosure: when_relevant
  acceptance_criteria:
  - An employer can list applicants for a listing they own.
  - An admin can export or forward applicants for a listing.
- id: JB-ASM-005
  statement: Only the employer who owns a listing may update application statuses (submitted, reviewed,
    shortlisted, rejected, hired) for applications to that listing. Administrators do not change application
    status.
  category: assumption
  status: assumed
  origin: instructor
  decision_id: DEC-JB-006
  approved_by: instructor
  approved_at: '2026-11-02T20:26:00Z'
  rationale: Completes the status pipeline decision; transcript leaves updater role unspecified. Instructor
    chose employer-only.
  known_by:
  - administrator
  - graduate_applicant
  - employer
  disclosure: when_relevant
  acceptance_criteria:
  - Employer can transition status on applications to their own listings.
  - Admin attempts to change application status are rejected or unavailable.
- id: JB-ASM-006
  statement: administrator is platform_admin for the job board (review/publish/reject listings, subscriber
    notify, eligibility gate, export/forward applicant packages, unpublish). employer is operator for
    their own listings and application status updates. graduate_applicant is end_user (profile, subscribe,
    apply, view own status). Exact admin UI screens remain elicitation.
  category: assumption
  status: assumed
  origin: instructor
  decision_id: DEC-JB-007
  approved_by: instructor
  approved_at: '2026-11-10T02:37:00Z'
  rationale: Instructor accepted system-role split.
  known_by:
  - administrator
  - employer
  - graduate_applicant
  disclosure: when_relevant
- id: JB-ASM-007
  statement: When an administrator rejects a pending listing, the employer must revise and resubmit before
    another admin review. Rejected listings are not visible to graduates.
  category: assumption
  status: assumed
  origin: instructor
  decision_id: DEC-JB-008
  approved_by: instructor
  approved_at: '2026-11-10T02:38:00Z'
  rationale: Instructor chose reject → revise/resubmit path.
  known_by:
  - administrator
  - employer
  disclosure: when_relevant
- id: JB-ASM-008
  statement: When an administrator publishes a listing, eligible programme subscribers are notified automatically.
    A separate mandatory notify click is not required in graded MVP. Exact email/template copy remains
    elicitation.
  category: assumption
  status: assumed
  origin: instructor
  decision_id: DEC-JB-009
  approved_by: instructor
  approved_at: '2026-11-10T02:39:00Z'
  rationale: Instructor chose auto-notify on publish (matches transcript desire).
  known_by:
  - administrator
  - graduate_applicant
  disclosure: when_relevant
- id: JB-ASM-009
  statement: Administrator may unpublish a live listing so it is hidden from graduates; the owning employer
    can see that status. Employer self-withdraw of live listings is out of graded MVP unless elicited.
  category: assumption
  status: assumed
  origin: instructor
  decision_id: DEC-JB-010
  approved_by: instructor
  approved_at: '2026-11-10T02:39:30Z'
  rationale: Instructor chose admin unpublish only (option 1).
  known_by:
  - administrator
  - employer
  disclosure: when_relevant
