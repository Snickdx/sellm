brief: Eligible programme graduates browse and apply to jobs; employers submit listings for admin approval;
  administrators (platform_admin) publish, reject (employer must revise/resubmit), unpublish, and auto-notify
  subscribers on publish; employers operate their own listings and application statuses; admins can export
  applicant packages. Applications support external-link or on-platform collect modes.
