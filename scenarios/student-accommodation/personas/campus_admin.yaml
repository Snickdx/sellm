  - SA-ASM-004
  - SA-ASM-005
uncertainty_policy: >-
  Admit unknowns; do not invent rental law, crime statistics, or landlord
  private financial terms.
referral_rules:
  - Refer lease negotiations and payments to the student and landlord off-platform
  - Refer safety emergencies to campus security / police as appropriate
