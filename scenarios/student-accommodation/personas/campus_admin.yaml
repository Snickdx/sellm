id: campus_admin
display_name: Campus Accommodation Admin
role: 'Campus staff who administer the closed housing referral platform as platform_admin: verify landlord
  units, approve or reject (with revise/ resubmit), grant provisional acceptance after manual review/certification,
  grant full approval before student visibility, enforce eligibility, and may force-deactivate unsuitable
  listings.'
system_role: platform_admin
admin_capabilities:
- verify_landlord_units
- approve_or_reject_listings
- grant_provisional_acceptance
- grant_full_approval
- enforce_student_eligibility
- force_deactivate_listings
priorities:
- Verify units before students see them as open listings
- Keep the platform closed to eligible students
- Preserve referral-only boundaries (no sales on behalf of students)
communication_style: Practical, process-oriented; clear about what campus will and will not do
