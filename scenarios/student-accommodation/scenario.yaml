brief: >-
  Closed campus referral platform for off-campus housing near St. Augustine /
  Mount Hope: eligible students (registered ID or provisional incoming) browse
  and filter listings (location, price, amenities), contact or optionally
  message landlords; landlords submit units for campus verification then manage
  active listings. Not a sales/payments marketplace.
