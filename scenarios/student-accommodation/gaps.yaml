        cue_id: ddb31cdc-b2f1-4be5-a94b-cd9eecd07eda/144-1
        start: "00:21:03.182"
        end: "00:21:08.191"
        speaker: null
        note: Campus verifies unit in person
      - file: sources/Student Accommodation Project - Sy'rai Simon.vtt
        cue_id: ddb31cdc-b2f1-4be5-a94b-cd9eecd07eda/145-2
        start: "00:21:26.406"
        end: "00:21:30.468"
        speaker: null
        note: Checklist to confirm
      - file: sources/Student Accommodation Project - Sy'rai Simon.vtt
        cue_id: ddb31cdc-b2f1-4be5-a94b-cd9eecd07eda/110-0
        start: "00:16:07.311"
        end: "00:16:13.295"
        speaker: null
        note: Turn listings on/off by availability
      - file: sources/Student Accommodation Project - Sy'rai Simon.vtt
        cue_id: ddb31cdc-b2f1-4be5-a94b-cd9eecd07eda/201-1
        start: "00:30:26.612"
        end: "00:30:30.702"
        speaker: null
        note: Active vs not active controls listing visibility
    why_it_matters: Admin vs landlord permissions and what students can see.
    alternatives:
      - Landlord submits → pending → campus_admin verifies/approves → landlord can set active/inactive
      - Campus_admin creates all listings after offline verification (no landlord self-serve submit)
      - Landlord publishes directly; campus can take down later
      - Defer for student elicitation
    recommended_default: >-
      Landlord submits → pending → campus_admin verifies/approves → landlord can
      set active/inactive
    status: decided
    actions: [accept, modify, reject, defer]

