  - id: GAP-SA-003
    priority: critical
    prompt: |
      Stakeholders insist this is a referral platform — not sales, and campus
      does not engage on behalf of students. Confirm the graded MVP transaction
      boundary after a student finds a listing.
    citations:
      - file: sources/Student Accommodation Project - Sy'rai Simon.vtt
        cue_id: ddb31cdc-b2f1-4be5-a94b-cd9eecd07eda/43-0
        start: "00:05:03.431"
