        speaker: null
        note: From listing, contact the landlord
      - file: sources/Student Accommodation Project - Sy'rai Simon.vtt
        cue_id: ddb31cdc-b2f1-4be5-a94b-cd9eecd07eda/43-2
        start: "00:05:09.746"
        end: "00:05:14.172"
        speaker: null
        note: Engage directly with landlord
      - file: sources/Student Accommodation Project - Sy'rai Simon.vtt
        cue_id: ddb31cdc-b2f1-4be5-a94b-cd9eecd07eda/208-0
        start: "00:31:06.031"
        end: "00:31:10.200"
        speaker: null
      - file: sources/Student Accommodation Project - Sy'rai Simon.vtt
        cue_id: ddb31cdc-b2f1-4be5-a94b-cd9eecd07eda/208-2
        start: "00:31:12.589"
        end: "00:31:16.301"
        speaker: null
        note: Referral platform, not sales
      - file: sources/Student Accommodation Project - Sy'rai Simon.vtt
        cue_id: ddb31cdc-b2f1-4be5-a94b-cd9eecd07eda/216-3
        start: "00:31:53.274"
        end: "00:31:55.871"
        speaker: null
        note: Student needs landlord contact info
    why_it_matters: >-
      Bounds payments, in-app chat, booking, and whether campus mediates deals.
    alternatives:
      - Referral only — show contact (phone/email); no in-app booking, payments, or mediated chat
      - Referral + optional in-app message thread; still no payments/contracts
      - Full marketplace — apply/book/pay on platform
      - Defer for student elicitation
    recommended_default: >-
      Referral only — show contact (phone/email); no in-app booking, payments, or
      mediated chat
    status: decided
    actions: [accept, modify, reject, defer]

  - id: GAP-SA-004
    priority: critical
    prompt: |
      Landlords must be verified by campus (site visit / checklist) before units
      are suitable for students. What is the graded listing publish lifecycle?
    citations:
