open_questions:
  - id: GAP-SA-001
    priority: critical
    prompt: |
      Interview stakeholders are Mr Kevin Snaggs and Mr Kobe Sandy (campus
      accommodation / referral side). The VTT describes students browsing
      off-campus listings and landlords managing units after campus
      verification. Which personas should the student-facing scenario include?
    citations:
      - file: sources/Student Accommodation Project - Sy'rai Simon.vtt
        cue_id: ddb31cdc-b2f1-4be5-a94b-cd9eecd07eda/12-1
        start: "00:00:15.499"
        end: "00:00:21.980"
        speaker: null
      - file: sources/Student Accommodation Project - Sy'rai Simon.vtt
        cue_id: ddb31cdc-b2f1-4be5-a94b-cd9eecd07eda/43-3
        start: "00:05:14.172"
        end: "00:05:18.221"
        speaker: null
      - file: sources/Student Accommodation Project - Sy'rai Simon.vtt
        cue_id: ddb31cdc-b2f1-4be5-a94b-cd9eecd07eda/44-1
        start: "00:05:31.367"
        end: "00:05:34.677"
        speaker: null
      - file: sources/Student Accommodation Project - Sy'rai Simon.vtt
        cue_id: ddb31cdc-b2f1-4be5-a94b-cd9eecd07eda/144-0
        start: "00:20:58.791"
        end: "00:21:03.182"
        speaker: null
    why_it_matters: Personas bound known_fact_ids.
    alternatives:
      - campus_admin only (transcript-faithful)
      - campus_admin + student_seeker + landlord
      - campus_admin + student_seeker only (landlord facts via admin)
      - Defer — decide after pilot
    recommended_default: campus_admin + student_seeker + landlord
    status: decided
    actions: [accept, modify, reject, defer]

