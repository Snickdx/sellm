    competency: allocate_under_budget_hours
    description: >-
      System allocates TAs to courses under budget and hard 20h/week cap.
    related_fact_ids: [TA-REQ-001, TA-REQ-003, TA-BR-001, TA-ASM-003, TA-WF-001]

  - id: EVAL-TA-002
    competency: soft_experience_preference
