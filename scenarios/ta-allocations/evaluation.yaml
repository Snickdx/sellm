      Graded MVP has course assignments + hours only; no task timesheets/progress.
    related_fact_ids: [TA-ASM-005, TA-BR-003, TA-WF-002]

  - id: EVAL-TA-005
    competency: hr_out_of_scope
    description: HR/contracts are external; not required in-app.
    related_fact_ids: [TA-REQ-008, TA-BR-004]

