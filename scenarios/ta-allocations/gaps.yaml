open_questions:
  - id: GAP-TA-001
    priority: critical
    prompt: |
      Stakeholders are Doctor Vijay and Ms Srida Mohammed (TA workload /
      allocation). The VTT describes HOD/departmental staff allocating TAs,
      lecturers supervising day-to-day work, markers progressing to TAs, and HR
      contract steps. Which personas should the student-facing scenario include?
    citations:
      - file: sources/TA Allocation Project - Cathreena Paul.vtt
        cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/7-1
        start: "00:00:06.875"
        end: "00:00:12.731"
        speaker: null
      - file: sources/TA Allocation Project - Cathreena Paul.vtt
        cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/30-0
        start: "00:02:45.084"
        end: "00:02:51.862"
        speaker: null
      - file: sources/TA Allocation Project - Cathreena Paul.vtt
        cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/71-0
        start: "00:07:56.764"
        end: "00:08:02.896"
        speaker: null
      - file: sources/TA Allocation Project - Cathreena Paul.vtt
        cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/141-0
        start: "00:16:34.204"
        end: "00:16:42.086"
        speaker: null
      - file: sources/TA Allocation Project - Cathreena Paul.vtt
        cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/176-2
        start: "00:20:48.311"
        end: "00:20:53.856"
        speaker: null
    why_it_matters: Personas bound known_fact_ids.
    alternatives:
      - hod only (transcript-faithful)
      - hod + course_lecturer + teaching_assistant
      - hod + course_lecturer + teaching_assistant + hr_officer
      - Defer — decide after pilot
    recommended_default: hod + course_lecturer + teaching_assistant
    status: decided
    actions: [accept, modify, reject, defer]

  - id: GAP-TA-002
    priority: critical
    prompt: |
      With a single hod persona (DEC-TA-001), what is the *graded product*
      boundary for the TA allocation system?
    citations:
      - file: sources/TA Allocation Project - Cathreena Paul.vtt
        cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/19-1
        start: "00:01:30.591"
        end: "00:01:35.617"
        speaker: null
        note: Budgetary constraints on TA count
      - file: sources/TA Allocation Project - Cathreena Paul.vtt
        cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/23-4
        start: "00:02:08.541"
        end: "00:02:11.524"
        speaker: null
        note: Max 20 hours/week
      - file: sources/TA Allocation Project - Cathreena Paul.vtt
        cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/23-0
        start: "00:01:51.404"
        end: "00:01:54.768"
        speaker: null
        note: Assign by prior course experience
      - file: sources/TA Allocation Project - Cathreena Paul.vtt
        cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/176-2
        start: "00:20:48.311"
        end: "00:20:53.856"
        speaker: null
        note: HR approval in real hiring path
      - file: sources/TA Allocation Project - Cathreena Paul.vtt
        cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/64-1
        start: "00:07:13.545"
        end: "00:07:20.705"
        speaker: null
        note: Progress tracking vs lecturer responsibility
    why_it_matters: Keeps MVP to HOD-visible allocation/tracking without building HR/payroll.
    alternatives:
      - Allocate TAs to courses under budget/hours; record assignments and workloads visible to HOD (HR/contracts out of system)
      - Same, plus lecturer task/progress tracking inside the system
      - Full hire-to-contract path including HR approval steps in-app
      - Defer for student elicitation
    recommended_default: >-
      Allocate TAs to courses under budget/hours; record assignments and
      workloads visible to HOD (HR/contracts out of system)
    status: decided
    actions: [accept, modify, reject, defer]

  - id: GAP-TA-003
    priority: critical
    prompt: |
      Transcript states TAs are given a maximum of 20 hours a week. How hard
      should that be in the graded system?
    citations:
      - file: sources/TA Allocation Project - Cathreena Paul.vtt
        cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/23-4
        start: "00:02:08.541"
        end: "00:02:11.524"
        speaker: null
      - file: sources/TA Allocation Project - Cathreena Paul.vtt
        cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/82-2
        start: "00:09:34.825"
        end: "00:09:41.273"
        speaker: null
        note: Example lab-hour accounting
    why_it_matters: Core business rule for allocation validation and overload warnings.
    alternatives:
      - Hard cap — system blocks assignments that would exceed 20h/week per TA
      - Soft warning — allow override with HOD acknowledgement
      - Policy text only — no automated enforcement (elicitation)
      - Defer
    recommended_default: Hard cap — system blocks assignments that would exceed 20h/week per TA
    status: decided
    actions: [accept, modify, reject, defer]

  - id: GAP-TA-004
    priority: critical
    prompt: |
      Stakeholders prefer keeping TAs on courses they have already taught/marked,
      and say HODs have stronger final selectivity than lecturers. How should
      assignment preference work in the graded MVP?
    citations:
      - file: sources/TA Allocation Project - Cathreena Paul.vtt
        cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/23-1
        start: "00:01:54.768"
        end: "00:02:00.036"
        speaker: null
      - file: sources/TA Allocation Project - Cathreena Paul.vtt
        cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/23-3
        start: "00:02:04.542"
        end: "00:02:08.541"
        speaker: null
      - file: sources/TA Allocation Project - Cathreena Paul.vtt
        cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/39-0
        start: "00:03:50.284"
        end: "00:03:56.363"
        speaker: null
      - file: sources/TA Allocation Project - Cathreena Paul.vtt
        cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/43-2
        start: "00:04:20.478"
        end: "00:04:26.865"
        speaker: null
        note: Final choices when it comes to the TAs
    why_it_matters: Ranking/eligibility UX for HOD allocation decisions.
    alternatives:
      - Soft preference — system highlights prior course experience; HOD may assign anyone eligible under hours/budget
      - Hard filter — only TAs with prior experience on that course may be assigned (unless HOD override flag)
      - Lecturer nominates; HOD must approve final assignment
      - Defer for student elicitation
    recommended_default: >-
      Soft preference — system highlights prior course experience; HOD may
      assign anyone eligible under hours/budget
    status: decided
    actions: [accept, modify, reject, defer]

  - id: GAP-TA-005
    priority: important
    prompt: |
      DEC-TA-002 includes lecturer task/progress tracking, but the chatbot
      persona is hod-only. What must the graded MVP record for TA work under a
      course?
    citations:
      - file: sources/TA Allocation Project - Cathreena Paul.vtt
        cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/24-0
        start: "00:02:12.764"
        end: "00:02:20.353"
        speaker: null
        note: Classroom and marking work
      - file: sources/TA Allocation Project - Cathreena Paul.vtt
        cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/54-0
        start: "00:06:00.844"
        end: "00:06:06.284"
        speaker: null
        note: Weekly assigned tasks discussed
      - file: sources/TA Allocation Project - Cathreena Paul.vtt
        cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/64-1
        start: "00:07:13.545"
        end: "00:07:20.705"
        speaker: null
      - file: sources/TA Allocation Project - Cathreena Paul.vtt
        cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/242-0
        start: "00:27:11.884"
        end: "00:27:18.161"
        speaker: null
        note: Weekly schedule / which labs
    why_it_matters: Defines minimum tracking entities without a lecturer chatbot persona.
    alternatives:
      - Per-TA weekly planned hours by task type (lab/tutorial/marking/other) + simple completion/status notes visible to HOD
      - Full timesheets with daily clock-in and student-facing TA portal
      - Assignment to course only — no task-level tracking after all (narrow DEC-TA-002)
      - Defer for student elicitation
    recommended_default: >-
      Per-TA weekly planned hours by task type (lab/tutorial/marking/other) +
      simple completion/status notes visible to HOD
    status: decided
    actions: [accept, modify, reject, defer]

