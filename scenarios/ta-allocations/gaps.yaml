- id: GAP-TA-003
  priority: critical
  prompt: 'Transcript states TAs are given a maximum of 20 hours a week. How hard

    should that be in the graded system?

    '
  citations:
  - file: sources/TA Allocation Project - Cathreena Paul.vtt
    cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/23-4
    start: '00:02:08.541'
    end: '00:02:11.524'
    speaker: null
  - file: sources/TA Allocation Project - Cathreena Paul.vtt
    cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/82-2
    start: '00:09:34.825'
    end: '00:09:41.273'
    speaker: null
    note: Example lab-hour accounting
  why_it_matters: Core business rule for allocation validation and overload warnings.
  alternatives:
  - Hard cap — system blocks assignments that would exceed 20h/week per TA
  - Soft warning — allow override with HOD acknowledgement
  - Policy text only — no automated enforcement (elicitation)
  - Defer
  recommended_default: Hard cap — system blocks assignments that would exceed 20h/week per TA
  status: decided
  actions:
  - accept
  - modify
  - reject
  - defer
- id: GAP-TA-004
  priority: critical
  prompt: 'Stakeholders prefer keeping TAs on courses they have already taught/marked,

    and say HODs have stronger final selectivity than lecturers. How should

    assignment preference work in the graded MVP?

    '
  citations:
  - file: sources/TA Allocation Project - Cathreena Paul.vtt
    cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/23-1
    start: '00:01:54.768'
    end: '00:02:00.036'
    speaker: null
  - file: sources/TA Allocation Project - Cathreena Paul.vtt
    cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/23-3
    start: '00:02:04.542'
    end: '00:02:08.541'
    speaker: null
  - file: sources/TA Allocation Project - Cathreena Paul.vtt
    cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/39-0
    start: '00:03:50.284'
    end: '00:03:56.363'
    speaker: null
  - file: sources/TA Allocation Project - Cathreena Paul.vtt
    cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/43-2
    start: '00:04:20.478'
    end: '00:04:26.865'
    speaker: null
    note: Final choices when it comes to the TAs
  why_it_matters: Ranking/eligibility UX for HOD allocation decisions.
  alternatives:
  - Soft preference — system highlights prior course experience; HOD may assign anyone eligible under
    hours/budget
  - Hard filter — only TAs with prior experience on that course may be assigned (unless HOD override flag)
  - Lecturer nominates; HOD must approve final assignment
  - Defer for student elicitation
  recommended_default: Soft preference — system highlights prior course experience; HOD may assign anyone
    eligible under hours/budget
  status: decided
  actions:
  - accept
  - modify
  - reject
  - defer
- id: GAP-TA-005
  priority: important
  prompt: 'DEC-TA-002 includes lecturer task/progress tracking, but the chatbot

    persona is hod-only. What must the graded MVP record for TA work under a

    course?

    '
  citations:
  - file: sources/TA Allocation Project - Cathreena Paul.vtt
    cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/24-0
    start: '00:02:12.764'
    end: '00:02:20.353'
    speaker: null
    note: Classroom and marking work
  - file: sources/TA Allocation Project - Cathreena Paul.vtt
    cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/54-0
    start: '00:06:00.844'
    end: '00:06:06.284'
    speaker: null
    note: Weekly assigned tasks discussed
  - file: sources/TA Allocation Project - Cathreena Paul.vtt
    cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/64-1
    start: '00:07:13.545'
    end: '00:07:20.705'
    speaker: null
  - file: sources/TA Allocation Project - Cathreena Paul.vtt
    cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/242-0
    start: '00:27:11.884'
    end: '00:27:18.161'
    speaker: null
    note: Weekly schedule / which labs
  why_it_matters: Defines minimum tracking entities without a lecturer chatbot persona.
  alternatives:
  - Per-TA weekly planned hours by task type (lab/tutorial/marking/other) + simple completion/status notes
    visible to HOD
  - Full timesheets with daily clock-in and student-facing TA portal
  - Assignment to course only — no task-level tracking after all (narrow DEC-TA-002)
  - Defer for student elicitation
  recommended_default: Per-TA weekly planned hours by task type (lab/tutorial/marking/other) + simple
    completion/status notes visible to HOD
  status: decided
  actions:
  - accept
  - modify
  - reject
  - defer
- id: GAP-TA-006
  priority: critical
  theme: system_authority
  prompt: 'Depth-update: the chat persona is hod only. Is the Head of Department the

    platform_admin / allocating authority who creates and changes TA↔course

    assignments in the graded system (budget + 20h hard cap), with HR and

    lecturers outside the system?

    '
  citations:
  - file: sources/TA Allocation Project - Cathreena Paul.vtt
    cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/19-1
    note: Department allocates TAs to courses under budget
  - file: sources/TA Allocation Project - Cathreena Paul.vtt
    cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/23-4
    note: 20h/week maximum
  why_it_matters: Makes understated admin authority explicit via system_role.
  alternatives:
  - Yes — hod=platform_admin for allocations; HR/lecturers out of chat/system scope
  - hod=operator only; a departmental admin staff role is the real platform_admin (out of chat)
  - hod=approver; lecturers request and HOD only signs off (lecturer not in chat)
  - Defer for student elicitation
  recommended_default: Yes — hod=platform_admin for allocations; HR/lecturers out of chat/system scope
  suggested_assumption: 'hod is platform_admin for the TA allocation product: create/change/remove

    course assignments, enforce budget and the hard 20h/week cap, and view

    workload records. HR contracts and lecturer task portals remain out of

    graded MVP. Exact admin UI screens remain elicitation.

    '
  status: decided
  actions:
  - accept
  - modify
  - reject
  - defer
- id: GAP-TA-007
  priority: important
  theme: exception_path
  prompt: 'What should happen when the HOD tries to assign hours that would exceed

    the hard 20h/week cap (already a hard block per DEC-TA-003)?

    '
  citations:
  - file: sources/TA Allocation Project - Cathreena Paul.vtt
    cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/23-4
    note: Maximum 20 hours/week
  why_it_matters: Makes the hard-block UX/exception path explicit for students.
  alternatives:
  - Block save and show remaining capacity; HOD must reduce hours or reassign elsewhere
  - Block save but allow an HOD override with a recorded reason (softens hard cap)
  - Auto-truncate hours to remaining capacity without blocking
  - Defer for student elicitation
  recommended_default: Block save and show remaining capacity; HOD must reduce hours or reassign elsewhere
  suggested_assumption: 'Assignments that would exceed 20 planned hours/week are blocked (not

    overridable in graded MVP). The system shows remaining capacity so the HOD

    can reduce hours or change assignments. Exact error copy remains

    elicitation.

    '
  status: decided
  actions:
  - accept
  - modify
  - reject
  - defer
- id: GAP-TA-008
  priority: important
  theme: exception_path
  prompt: 'May the HOD remove or reduce an existing TA↔course assignment mid-term

    (reallocation), or are assignments immutable once saved in graded MVP?

    '
  citations:
  - file: sources/TA Allocation Project - Cathreena Paul.vtt
    cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/19-1
    note: HOD allocates under changing need/budget
  why_it_matters: Completes admin lifecycle beyond first assign.
  alternatives:
  - Yes — HOD may edit hours, reassign, or remove assignments; system rechecks 20h/budget
  - Hours editable; course assignment cannot be removed once saved (only reduced to zero via elicitation)
  - Immutable after save for graded MVP; changes are out-of-band
  - Defer for student elicitation
  recommended_default: Yes — HOD may edit hours, reassign, or remove assignments; system rechecks 20h/budget
  suggested_assumption: 'hod may create, edit hours, reassign, or remove TA↔course assignments in

    graded MVP. Every change revalidates the hard 20h/week cap and budget

    constraints. Exact history/audit UI remains elicitation.

    '
  status: decided
  actions:
  - accept
  - modify
  - reject
  - defer
- id: GAP-TA-009
  priority: important
  theme: config_default
  prompt: 'Is departmental TA budget also a hard system block (like 20h/week), or a

    soft warning the HOD may exceed?

    '
  citations:
  - file: sources/TA Allocation Project - Cathreena Paul.vtt
    cue_id: ac26db00-3af2-479f-afc1-54b763e99dbb/19-0
    note: Allocations constrained primarily by budget
  why_it_matters: Clarifies budget enforcement vs the already-hard hour cap.
  alternatives:
  - Hard block — cannot save assignments that would exceed departmental TA budget
  - Soft warning — HOD may proceed after acknowledging over-budget
  - Budget is informational only in graded MVP (track remaining; no block)
  - Defer for student elicitation
  recommended_default: Soft warning — HOD may proceed after acknowledging over-budget
  suggested_assumption: 'Departmental TA budget is enforced as a soft warning in graded MVP: the

    system shows remaining budget and warns on over-budget assignments, but

    the HOD may still save after acknowledging. The 20h/week cap remains a

    hard block. Exact budget units/currency remain elicitation.

    '
  status: decided
  actions:
  - accept
  - modify
  - reject
  - defer
