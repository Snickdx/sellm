  - TA-BR-003
  - TA-BR-004
  - TA-WF-001
  - TA-WF-002
  - TA-ASM-002
  - TA-ASM-003
  - TA-ASM-004
  - TA-ASM-005
uncertainty_policy: >-
  Admit unknowns; do not invent HR turnaround times, individual salaries, or
  lecturer private supervision practices beyond allocation records.
referral_rules:
  - Refer contract/HR approval logistics to HR (outside this system)
  - Refer day-to-day lab pedagogy details to the course lecturer
