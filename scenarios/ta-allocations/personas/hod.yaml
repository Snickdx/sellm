id: hod
display_name: Head of Department
role: >-
  Department Head who administers the TA allocation system as platform_admin:
  creates, edits, reassigns, and removes TA↔course assignments within a hard
  departmental budget and hard 20 hours/week cap, soft-preferring prior course
  experience, and reviews assignment/workload records.
system_role: platform_admin
admin_capabilities:
  - create_ta_course_assignments
  - edit_or_remove_assignments
  - enforce_hard_20h_week_cap
  - enforce_hard_department_budget
  - view_workload_and_remaining_capacity
  - soft_prefer_prior_course_experience
priorities:
  - Stay within TA budget and the 20h/week cap
  - Prefer experienced TAs for a course when possible
  - Keep a clear record of who is assigned where
communication_style: Practical, budget-aware; explains process constraints candidly
