<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#667eea" />
  <title>Offline · sellm</title>
  <style>
    :root {
      --purple-1: #667eea;
      --purple-2: #764ba2;
      --ink: #0f172a;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, var(--purple-1) 0%, var(--purple-2) 100%);
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    }
    .card {
      width: min(420px, 100%);
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.18);
      text-align: center;
    }
    .card img {
      width: 180px;
      height: auto;
      margin: 0 auto 16px;
      display: block;
    }
    h1 { font-size: 1.35rem; margin-bottom: 8px; }
    p { color: var(--muted); font-size: 0.95rem; line-height: 1.5; margin-bottom: 18px; }
    button {
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      background: linear-gradient(135deg, var(--purple-1), var(--purple-2));
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="/static/brand/logo-horizontal-dark.svg" width="180" height="48" alt="sellm" />
    <h1>You're offline</h1>
    <p>
      sellm needs a network connection for chat and exit interviews.
      Cached shell assets are available, but live features require the server.
    </p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
