<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · Requirements Chatbot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f172a;
            color: #0f172a;
            min-height: 100vh;
        }
        .topbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .topbar h1 { font-size: 18px; font-weight: 700; }
        .topbar a, .topbar button.linkish {
            color: #eef2ff;
            text-decoration: none;
            font-size: 13px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
        }
        .topbar a:hover, .topbar button.linkish:hover { background: rgba(255,255,255,0.22); }
        .shell {
            display: grid;
            grid-template-columns: 220px minmax(280px, 1.1fr) minmax(0, 1.6fr);
            height: calc(100vh - 52px);
            background: #f8fafc;
        }
        .nav, .list-pane, .detail-pane {
            min-height: 0;
            overflow: auto;
            border-right: 1px solid #e2e8f0;
        }
        .detail-pane { border-right: none; }
        .nav {
            background: #f1f5f9;
            padding: 12px;
        }
        .nav button {
            width: 100%;
            text-align: left;
            border: none;
            background: transparent;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 6px;
            cursor: pointer;
            color: #334155;
            font-size: 13px;
            font-weight: 600;
        }
        .nav button.active, .nav button:hover {
            background: #eef2ff;
            color: #3730a3;
        }
        .pane-header {
            padding: 12px 14px;
            border-bottom: 1px solid #e2e8f0;
            background: linear-gradient(180deg, #f1f5f9 0%, #f8fafc 100%);
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .pane-header h2 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #64748b;
            margin-bottom: 8px;
        }
        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .toolbar input, .toolbar select, .field input, .field select, .field textarea {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 13px;
            background: #fff;
            width: 100%;
        }
        .toolbar input { max-width: 220px; }
        .user-item, .convo-item {
            display: block;
            width: 100%;
            text-align: left;
            border: none;
            border-bottom: 1px solid #e2e8f0;
            background: #fff;
            padding: 12px 14px;
            cursor: pointer;
        }
        .user-item:hover, .convo-item:hover { background: #f8fafc; }
        .user-item.active, .convo-item.active {
            background: #eef2ff;
            border-left: 3px solid #6366f1;
        }
        .user-item .name { font-weight: 650; font-size: 14px; color: #0f172a; }
        .user-item .meta, .convo-item .meta { font-size: 12px; color: #64748b; margin-top: 4px; }
        .badge {
            display: inline-block;
            font-size: 11px;
            border-radius: 999px;
            padding: 2px 8px;
            margin-left: 6px;
            background: #e2e8f0;
            color: #334155;
        }
        .badge.admin { background: #fef3c7; color: #92400e; }
        .badge.warn { background: #fee2e2; color: #991b1b; }
        .detail-body { padding: 16px; }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .field { margin-bottom: 12px; }
        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 4px;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .btn {
            border: none;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .btn-secondary {
            background: #fff;
            border: 1px solid #d1d5db;
            color: #374151;
        }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .status {
            margin-top: 10px;
            font-size: 12px;
            color: #64748b;
            min-height: 16px;
        }
        .status.err { color: #b91c1c; }
        .status.ok { color: #047857; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
        }
        .stat .label { font-size: 11px; color: #64748b; text-transform: uppercase; }
        .stat .value { font-size: 22px; font-weight: 700; margin-top: 4px; color: #1e293b; }
        .transcript {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
            max-height: 420px;
            overflow: auto;
        }
        .msg { margin-bottom: 12px; }
        .msg .role {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 2px;
        }
        .msg.user .role { color: #3730a3; }
        .msg .content {
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.45;
            color: #1e293b;
        }
        .login-gate, .deny-gate {
            min-height: calc(100vh - 52px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 28px;
            width: min(420px, 92vw);
            box-shadow: 0 10px 40px rgba(15, 23, 42, 0.12);
        }
        .card h2 { margin-bottom: 8px; }
        .card p { color: #64748b; font-size: 14px; margin-bottom: 16px; }
        .hidden { display: none !important; }
        .provider-card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            background: #fff;
        }
        .provider-card h4 { font-size: 13px; margin-bottom: 8px; }
        @media (max-width: 980px) {
            .shell { grid-template-columns: 1fr; height: auto; }
            .nav, .list-pane, .detail-pane { border-right: none; border-bottom: 1px solid #e2e8f0; max-height: none; }
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>Admin · Requirements Chatbot</h1>
        <div style="display:flex;gap:8px;align-items:center;">
            <span id="adminWho" style="font-size:13px;opacity:0.9;"></span>
            <a href="/">← Chat</a>
            <button type="button" id="logoutBtn" class="linkish">Sign out</button>
        </div>
    </div>

    <div id="loginGate" class="login-gate hidden">
        <div class="card">
            <h2>Admin sign-in</h2>
            <p>Sign in with an admin account to manage users, tokens, and app defaults.</p>
            <div id="loginError" class="status err" hidden></div>
            <div class="field"><label>Username</label><input id="loginUsername" autocomplete="username" /></div>
            <div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" /></div>
            <div class="actions"><button type="button" id="loginBtn" class="btn btn-primary">Sign in</button></div>
        </div>
    </div>

    <div id="denyGate" class="deny-gate hidden">
        <div class="card">
            <h2>Admin access required</h2>
            <p id="denyText">This account is not an admin.</p>
            <div class="actions">
                <a class="btn btn-secondary" href="/">Back to chat</a>
                <button type="button" id="denyLogout" class="btn btn-primary">Sign out</button>
            </div>
        </div>
    </div>

    <div id="adminShell" class="shell hidden">
        <aside class="nav" aria-label="Admin sections">
            <button type="button" data-view="users" class="active">Users</button>
            <button type="button" data-view="tokens">Token monitor</button>
            <button type="button" data-view="appkeys">App-wide keys</button>
            <button type="button" data-view="defaults">Default model / mode</button>
        </aside>

        <section class="list-pane">
            <div class="pane-header">
                <h2 id="listTitle">Users</h2>
                <div class="toolbar" id="listToolbar"></div>
            </div>
            <div id="listBody"></div>
        </section>

        <section class="detail-pane">
            <div class="pane-header">
                <h2 id="detailTitle">Details</h2>
            </div>
            <div class="detail-body" id="detailBody">
                <p style="color:#64748b;font-size:14px;">Select a user or section to begin.</p>
            </div>
        </section>
    </div>

    <script src="/static/components/admin.js?v=2"></script>
</body>
</html>
