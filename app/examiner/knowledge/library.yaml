# Instructor-only judge gold. Sourced from instructor/private + templates ASSIGNMENT.md
slug: library
title: Library workshop booking
special_feature: Same-slot conflict resolution
starter_version: "0.2.0"
intended_pattern: Strategy
intended_pattern_aliases:
  - strategy pattern
  - policy
  - capacity guard
  - earlier request wins
focus_paths:
  - app/services/conflicts.py
  - app/services/bookings.py
architecture_defect:
  id: LIB-DEF-001
  summary: >-
    Conflict/capacity policy is one nested function with inverted FCFS, auto
    larger-cohort override, aggregate capacity ignored, cancelled bookings still
    block, coexist-on-slot overbooking.
  evidence: app/services/conflicts.py resolve_slot_request
  intended_fix: Strategy pattern for booking-slot resolution
defects:
