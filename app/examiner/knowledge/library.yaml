    summary: Nested conflict policy instead of Strategy policies.
    evidence: app/services/conflicts.py
  - id: LIB-DEF-002
    category: functional
    severity: high
    summary: Capacity checked per request only — overbooking allowed.
    evidence: conflicts.resolve_slot_request
  - id: LIB-DEF-003
    category: functional
    severity: high
    summary: Earlier-request-wins inverted (picks last after sort).
    evidence: conflicts ordered[-1]
  - id: LIB-DEF-004
    category: functional
    severity: high
    summary: Larger cohort auto-displaces without explicit override flag.
    evidence: conflicts headcount path
  - id: LIB-DEF-005
    category: functional
    severity: medium
    summary: New lecturer requests auto-accepted (skip coordinator review).
    evidence: bookings.request_booking
  - id: LIB-DEF-006
    category: functional
    severity: medium
    summary: Incomplete bookings allowed (empty course_code / resources).
    evidence: bookings.request_booking
  - id: LIB-DEF-007
    category: functional
