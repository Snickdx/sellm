# Job board — exit-interview answer bands for scorer calibration.
# Prompts generated at test time from planner + fixed index.
# low→1–2, mid→3–4, high→5 (provisional heuristic with knowledge pack).
scenario_slug: job-board
repository_sha: jbdeadbeef01
index:
  commit_sha: jbdeadbeef01
  files:
  - path: app/services/lifecycle.py
    language: python
    line_count: 140
  - path: app/services/applications.py
    language: python
    line_count: 110
  - path: app/services/listings.py
    language: python
    line_count: 100
