      testing: Green suite means done.
      verification: Agent wrote my section.
  mid:
    label: Partial / vague (length without gold terms)
    student_display_name: Career advising Mid
    expected_score_range:
    - 3
    - 4
    answers:
      design_to_code: Sprint one boxes on the whiteboard roughly match what shipped later. Some names
        moved around when we coded, and I am not sure which relationship stayed faithful versus what we
        reinvented under pressure.
      feature_ownership: I made a few edits in the main service path after standup. I cannot find my board
        card and I did not write down what callers should do when the insert fails.
      verification: A classmate pushed a big branch and I skimmed it before merge. I trusted the chat
        summary more than running the app myself, so my check was shallow.
      special_feature_pattern: The two advising modes felt copy-pasted and inconsistent in the starter.
        I said we cleaned those paths, but I cannot name the classes we added or the approach we chose.
      testing: The starter suite checks login and counts rows. That is thin for both advising modes and
        missing prerequisites, so we planned richer cases later but did not land them before the interview.
  high:
    label: Strong / gold-aligned
    student_display_name: Career advising High
    expected_score_range:
    - 5
    - 5
    answers:
      special_feature_pattern: 'For exploration advising pipelines we targeted duplicated career-first
        and course-first flows in exploration.py. Ranking used absolute wording and course-first skipped
        missing-course identification. We replaced that with the Template Method pattern: a shared skeleton
        with mode-specific hooks for match, non-absolute rank, identify gaps, and present.'
      design_to_code: Sprint 1 class diagram showed Template Method participants for the shared pipeline.
        Looking at exploration.py, both modes now call the same skeleton. Design drift removed enrol/Banner
        next-step hints from identify_gaps in advising.py so pattern participants stay on exploration
        hooks.
      feature_ownership: 'I personally extracted the shared skeleton in exploration.py and fixed explore_course_first
        missing_courses. Control flow always runs gap hooks. Trello CA-01 and PR #6 are my commits. Failure
        mode: high-school profiles must be rejected before exploration results are returned.'
      testing: 'tests/test_scenario.py is shallow and still passes with absolute career wording. I added
        a regression assertion that career-first never says You should pursue as a single forced path,
        and another that course-first returns missing_courses. Coverage gap: perfect overlap absolute
        wording.'
      verification: 'AI drafted the Template Method extract in exploration.py. I verified by running both
        pipeline regression tests and rejecting a patch that kept enrol hints in identify_gaps. PR #6
        has my review; ownership stayed with me.'
