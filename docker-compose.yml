# Local / staging stack. EasyPanel: use the Dockerfile + Environment + Mounts tabs instead.
# Usage:
#   docker compose up --build
#   docker compose --profile postgres up --build
#
# Security: do not ship default Neo4j/Postgres passwords on networked hosts.
# Set NEO4J_PASSWORD / POSTGRES_PASSWORD in the environment (see docs/OPS_LOCKDOWN.md).

services:
  app:
    build: .
    ports:
      - "${HOST_PORT:-8000}:${PORT:-8000}"
    environment:
      PORT: ${PORT:-8000}
      EXCEL_FILE: ${EXCEL_FILE:-/app/data.xlsx}
      CHROMA_PERSIST_DIRECTORY: ${CHROMA_PERSIST_DIRECTORY:-/app/storage/chroma_db_v2}
      SCENARIOS_ROOT: ${SCENARIOS_ROOT:-/app/scenarios}
      CONVERSATION_DB_URL: ${CONVERSATION_DB_URL:-sqlite:////app/storage/conversations.db}
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.2}
      RAG_BACKEND: ${RAG_BACKEND:-chromadb}
      TWEAK_MODE_ENABLED: ${TWEAK_MODE_ENABLED:-false}
      NEO4J_URI: ${NEO4J_URI:-bolt://host.docker.internal:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      ALLOW_DEFAULT_SEED_USERS: ${ALLOW_DEFAULT_SEED_USERS:-0}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_ALLOWED_ORGS: ${GITHUB_ALLOWED_ORGS:-}
      GITHUB_PUBLIC_ONLY: ${GITHUB_PUBLIC_ONLY:-1}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      VOICE_TOKEN_TTL_MINUTES: ${VOICE_TOKEN_TTL_MINUTES:-30}
      VOICE_UPLOAD_MAX_BYTES: ${VOICE_UPLOAD_MAX_BYTES:-209715200}
    volumes:
      - app_storage:/app/storage
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.getenv(\"PORT\", \"8000\")}/api/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sellm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sellm}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  app_storage:
  postgres_data:
